# Apache expande ${PORT} desde el environment del proceso
# Render inyecta PORT como variable de entorno (default 10000)
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Pasar variables de entorno al PHP
    PassEnv APP_ENV APP_KEY APP_URL APP_DEBUG
    PassEnv DB_CONNECTION DB_HOST DB_PORT DB_DATABASE DB_USERNAME DB_PASSWORD DB_SSLMODE
    PassEnv FILESYSTEM_DISK SESSION_DRIVER CACHE_STORE
    PassEnv WHATSAPP_NUMERO ADMIN_EMAIL ADMIN_NAME ADMIN_PASSWORD

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
